apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diarization-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diarization
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
# Scale-out with a ReadWriteOnce PVC will not share the HF cache across pods.
# Bake weights into the image or use ReadWriteMany before raising replicas.
